<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="asg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#f8f9fc"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Serverless GenAI API on AWS</text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">Request path (top) and supporting services (bottom)</text>

  <!-- top row -->
  <rect x="20" y="170" width="120" height="60" rx="9" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="80" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">Client</text>
  <text x="80" y="213" text-anchor="middle" font-size="11" fill="#6b7086">browser / curl</text>

  <rect x="210" y="170" width="170" height="60" rx="9" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="295" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">API Gateway</text>
  <text x="295" y="213" text-anchor="middle" font-size="11" fill="#6b7086">HTTP API, 30 s max</text>

  <rect x="450" y="170" width="160" height="60" rx="9" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="530" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">AWS Lambda</text>
  <text x="530" y="213" text-anchor="middle" font-size="11" fill="#6b7086">Python 3.13 handler</text>

  <rect x="680" y="170" width="200" height="60" rx="9" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
  <text x="780" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">Amazon Bedrock</text>
  <text x="780" y="213" text-anchor="middle" font-size="11" fill="#6b7086">us.amazon.nova-2-lite-v1:0</text>

  <!-- top arrows -->
  <line x1="142" y1="200" x2="206" y2="200" stroke="#4f5ecb" stroke-width="1.8" marker-start="url(#asg)" marker-end="url(#asg)"/>
  <text x="175" y="160" text-anchor="middle" font-size="11" fill="#6b7086">HTTPS</text>
  <line x1="382" y1="200" x2="446" y2="200" stroke="#4f5ecb" stroke-width="1.8" marker-start="url(#asg)" marker-end="url(#asg)"/>
  <text x="415" y="160" text-anchor="middle" font-size="11" fill="#6b7086">event</text>
  <line x1="612" y1="200" x2="676" y2="200" stroke="#4f5ecb" stroke-width="1.8" marker-start="url(#asg)" marker-end="url(#asg)"/>
  <text x="645" y="160" text-anchor="middle" font-size="11" fill="#6b7086">Converse</text>

  <!-- step numbers -->
  <text x="80" y="110" text-anchor="middle" font-size="11.5" fill="#20222b">1. POST /chat</text>
  <text x="295" y="110" text-anchor="middle" font-size="11.5" fill="#20222b">2. route + throttle</text>
  <text x="530" y="110" text-anchor="middle" font-size="11.5" fill="#20222b">3. validate, call model</text>
  <text x="780" y="110" text-anchor="middle" font-size="11.5" fill="#20222b">4. generate tokens</text>

  <!-- bottom row -->
  <rect x="160" y="300" width="200" height="56" rx="9" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
  <text x="260" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">IAM execution role</text>
  <text x="260" y="341" text-anchor="middle" font-size="11" fill="#6b7086">bedrock:InvokeModel only</text>

  <rect x="395" y="300" width="220" height="56" rx="9" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="505" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">CloudWatch</text>
  <text x="505" y="341" text-anchor="middle" font-size="11" fill="#6b7086">logs, metrics, alarms</text>

  <rect x="650" y="300" width="190" height="56" rx="9" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="745" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">Secrets Manager</text>
  <text x="745" y="341" text-anchor="middle" font-size="11" fill="#6b7086">third-party API keys</text>

  <!-- bottom arrows from Lambda -->
  <line x1="470" y1="232" x2="305" y2="297" stroke="#4f5ecb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#asg)"/>
  <line x1="530" y1="232" x2="530" y2="297" stroke="#4f5ecb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#asg)"/>
  <line x1="590" y1="232" x2="725" y2="297" stroke="#4f5ecb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#asg)"/>

  <text x="450" y="410" text-anchor="middle" font-size="11.5" fill="#6b7086">Dashed arrows: the function assumes its role, writes logs/metrics, and reads secrets at runtime.</text>
</svg>
