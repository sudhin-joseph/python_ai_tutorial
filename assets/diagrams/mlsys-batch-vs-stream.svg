<svg viewBox="0 0 900 345" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="mbsa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="900" height="345" fill="#f8f9fc"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Batch vs Stream Feature Pipelines</text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">DMLS Ch. 3 and 7: the same events, two ways to turn them into features</text>

  <text x="20" y="86" font-size="12" font-weight="700" fill="#2f9e63">BATCH PROCESSING  (static / slow-changing features)</text>
  <text x="20" y="200" font-size="12" font-weight="700" fill="#d97a34">STREAM PROCESSING  (dynamic / fast-changing features)</text>

  <g font-size="13" fill="#20222b" text-anchor="middle">
    <rect x="20" y="96" width="120" height="60" rx="9" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="80" y="121" font-weight="700">App events</text>
    <text x="80" y="140" font-size="11.5" fill="#6b7086">clicks, orders</text>
    <rect x="180" y="96" width="160" height="60" rx="9" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="260" y="121" font-weight="700">Data warehouse</text>
    <text x="260" y="140" font-size="11.5" fill="#6b7086">BigQuery, S3, Snowflake</text>
    <rect x="380" y="96" width="170" height="60" rx="9" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="465" y="121" font-weight="700">Batch job</text>
    <text x="465" y="140" font-size="11.5" fill="#6b7086">Spark / SQL, nightly</text>
    <rect x="590" y="96" width="150" height="60" rx="9" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="665" y="121" font-weight="700">Batch features</text>
    <text x="665" y="140" font-size="11.5" fill="#6b7086">hours to days old</text>

    <rect x="20" y="210" width="120" height="60" rx="9" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="80" y="235" font-weight="700">App events</text>
    <text x="80" y="254" font-size="11.5" fill="#6b7086">the same events</text>
    <rect x="180" y="210" width="160" height="60" rx="9" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="260" y="235" font-weight="700">Real-time transport</text>
    <text x="260" y="254" font-size="11.5" fill="#6b7086">Kafka, Kinesis</text>
    <rect x="380" y="210" width="170" height="60" rx="9" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="465" y="235" font-weight="700">Stream processor</text>
    <text x="465" y="254" font-size="11.5" fill="#6b7086">Flink, Spark Streaming</text>
    <rect x="590" y="210" width="150" height="60" rx="9" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="665" y="235" font-weight="700">Stream features</text>
    <text x="665" y="254" font-size="11.5" fill="#6b7086">seconds old</text>

    <rect x="780" y="140" width="100" height="86" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.8"/>
    <text x="830" y="178" font-weight="700">Model</text>
    <text x="830" y="197" font-size="11.5" fill="#6b7086">uses both</text>
  </g>

  <g stroke="#4f5ecb" stroke-width="1.8" fill="none" marker-end="url(#mbsa)">
    <line x1="140" y1="126" x2="176" y2="126"/>
    <line x1="340" y1="126" x2="376" y2="126"/>
    <line x1="550" y1="126" x2="586" y2="126"/>
    <line x1="140" y1="240" x2="176" y2="240"/>
    <line x1="340" y1="240" x2="376" y2="240"/>
    <line x1="550" y1="240" x2="586" y2="240"/>
    <line x1="740" y1="126" x2="776" y2="162"/>
    <line x1="740" y1="240" x2="776" y2="206"/>
  </g>

  <text x="450" y="318" text-anchor="middle" font-size="12" fill="#6b7086">Batch: high throughput, cheap, but stale.  Stream: fresh and low latency, but harder to build and operate.</text>
</svg>
