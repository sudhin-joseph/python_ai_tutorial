<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="pyg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">The Git Workflow</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">Changes move from your files to the staging area, into history, and up to GitHub</text>

  <rect x="20" y="85" width="175" height="105" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="107" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Working directory</text>
  <text x="107" y="140" text-anchor="middle" font-size="12" fill="#6b7086">your project files</text>
  <text x="107" y="158" text-anchor="middle" font-size="12" fill="#6b7086">as you edit them</text>

  <rect x="215" y="85" width="175" height="105" rx="10" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
  <text x="302" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Staging area</text>
  <text x="302" y="140" text-anchor="middle" font-size="12" fill="#6b7086">changes picked for</text>
  <text x="302" y="158" text-anchor="middle" font-size="12" fill="#6b7086">the next commit</text>

  <rect x="410" y="85" width="175" height="105" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="497" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Local repository</text>
  <text x="497" y="140" text-anchor="middle" font-size="12" fill="#6b7086">.git folder: the full</text>
  <text x="497" y="158" text-anchor="middle" font-size="12" fill="#6b7086">history of commits</text>

  <rect x="605" y="85" width="175" height="105" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
  <text x="692" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Remote (GitHub)</text>
  <text x="692" y="140" text-anchor="middle" font-size="12" fill="#6b7086">shared copy for your</text>
  <text x="692" y="158" text-anchor="middle" font-size="12" fill="#6b7086">team and servers</text>

  <!-- anchors -->
  <line x1="107" y1="190" x2="107" y2="300" stroke="#c7cbe0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="302" y1="190" x2="302" y2="250" stroke="#c7cbe0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="497" y1="190" x2="497" y2="250" stroke="#c7cbe0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="692" y1="190" x2="692" y2="300" stroke="#c7cbe0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- forward arrows -->
  <line x1="110" y1="245" x2="297" y2="245" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyg-arrow)"/>
  <text x="204" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">git add</text>
  <line x1="305" y1="245" x2="492" y2="245" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyg-arrow)"/>
  <text x="400" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">git commit</text>
  <line x1="500" y1="245" x2="687" y2="245" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyg-arrow)"/>
  <text x="594" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">git push</text>

  <!-- return arrow -->
  <line x1="689" y1="300" x2="112" y2="300" stroke="#2f9e63" stroke-width="2" marker-end="url(#pyg-arrow)"/>
  <text x="400" y="291" text-anchor="middle" font-size="13" font-weight="600" fill="#20222b">git clone / git pull (download others' commits)</text>

  <text x="400" y="350" text-anchor="middle" font-size="12.5" fill="#6b7086">Each commit is a saved snapshot you can return to; .gitignore keeps secrets and .venv out</text>
</svg>
