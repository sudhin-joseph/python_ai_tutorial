<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="rfA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#f8f9fc"/>
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Anatomy of a Responses API Call</text>
  <text x="430" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">What you send, what happens on the server, and what comes back</text>

  <!-- Request -->
  <rect x="20" y="80" width="250" height="300" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="145" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Your request</text>
  <g font-size="12" fill="#20222b">
    <text x="40" y="134" font-family="Menlo,Consolas,monospace">model</text>
    <text x="40" y="150" font-size="11" fill="#6b7086">which model + snapshot</text>
    <text x="40" y="178" font-family="Menlo,Consolas,monospace">instructions</text>
    <text x="40" y="194" font-size="11" fill="#6b7086">developer rules (high priority)</text>
    <text x="40" y="222" font-family="Menlo,Consolas,monospace">input</text>
    <text x="40" y="238" font-size="11" fill="#6b7086">a string or a list of items</text>
    <text x="40" y="266" font-family="Menlo,Consolas,monospace">tools / text / reasoning</text>
    <text x="40" y="282" font-size="11" fill="#6b7086">optional capabilities and format</text>
    <text x="40" y="310" font-family="Menlo,Consolas,monospace">previous_response_id</text>
    <text x="40" y="326" font-size="11" fill="#6b7086">or conversation: optional state</text>
    <text x="40" y="354" font-family="Menlo,Consolas,monospace">store, max_output_tokens</text>
    <text x="40" y="370" font-size="11" fill="#6b7086">retention and cost limits</text>
  </g>

  <!-- Server -->
  <rect x="320" y="150" width="210" height="160" rx="12" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="425" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">OpenAI platform</text>
  <g font-size="12" fill="#20222b" text-anchor="middle">
    <text x="425" y="204">1. check key + rate limits</text>
    <text x="425" y="228">2. tokenize the input</text>
    <text x="425" y="252">3. model reasons, may call</text>
    <text x="425" y="268">hosted tools (web, files)</text>
    <text x="425" y="292">4. generate output tokens</text>
  </g>

  <!-- Response -->
  <rect x="580" y="80" width="260" height="300" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="710" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Response object</text>
  <g font-size="12" fill="#20222b">
    <text x="600" y="132" font-family="Menlo,Consolas,monospace">id: "resp_..."</text>
    <text x="600" y="152" font-family="Menlo,Consolas,monospace">status: "completed"</text>
    <text x="600" y="176" font-family="Menlo,Consolas,monospace">output: [ items ]</text>
  </g>
  <rect x="600" y="186" width="220" height="26" rx="6" fill="#fff4ea" stroke="#d97a34" stroke-width="1.2"/>
  <text x="710" y="203" text-anchor="middle" font-size="11.5" fill="#20222b">reasoning (encrypted / summary)</text>
  <rect x="600" y="218" width="220" height="26" rx="6" fill="#fff4ea" stroke="#d97a34" stroke-width="1.2"/>
  <text x="710" y="235" text-anchor="middle" font-size="11.5" fill="#20222b">function_call / web_search_call</text>
  <rect x="600" y="250" width="220" height="40" rx="6" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.2"/>
  <text x="710" y="266" text-anchor="middle" font-size="11.5" fill="#20222b">message</text>
  <text x="710" y="282" text-anchor="middle" font-size="11" fill="#6b7086">content: output_text + annotations</text>
  <g font-size="12" fill="#20222b">
    <text x="600" y="318" font-family="Menlo,Consolas,monospace">usage: input / output /</text>
    <text x="600" y="334" font-family="Menlo,Consolas,monospace">  reasoning / cached tokens</text>
    <text x="600" y="362" font-family="Menlo,Consolas,monospace">.output_text</text>
    <text x="700" y="362" font-size="11" fill="#6b7086">SDK shortcut</text>
  </g>

  <g stroke="#4f5ecb" stroke-width="1.8" fill="none">
    <line x1="272" y1="230" x2="316" y2="230" marker-end="url(#rfA)"/>
    <line x1="532" y1="230" x2="576" y2="230" marker-end="url(#rfA)"/>
  </g>

  <rect x="20" y="398" width="820" height="36" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.2"/>
  <text x="430" y="421" text-anchor="middle" font-size="12" fill="#20222b">Billing = input tokens × input price + (visible + reasoning) output tokens × output price</text>
  <text x="430" y="456" text-anchor="middle" font-size="11.5" fill="#6b7086">Never assume output[0] is the text: loop over output items, or use response.output_text.</text>
</svg>
