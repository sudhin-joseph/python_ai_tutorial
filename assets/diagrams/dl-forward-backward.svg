<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97a34"/></marker></defs>
  <rect width="800" height="400" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">A 2-Layer Network: Forward and Backward</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">The forward pass computes the loss; backpropagation sends gradients back through the same steps</text>
  <text x="400" y="104" text-anchor="middle" font-size="12.5" fill="#4f5ecb" font-weight="700">forward: compute predictions and the loss</text>
  <path d="M80,122 L728,122" fill="none" stroke="#4f5ecb" stroke-width="2" marker-end="url(#ah)"/>
  <g font-size="12.5" fill="#20222b" text-anchor="middle">
    <rect x="30" y="150" width="120" height="60" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="90" y="175" font-weight="700">Input X</text><text x="90" y="196" font-size="11.5" fill="#6b7086">shape (N, D)</text>
    <rect x="190" y="150" width="190" height="60" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="285" y="175" font-weight="700">Hidden layer</text><text x="285" y="196" font-size="11.5">h = ReLU(X W1 + b1)</text>
    <rect x="420" y="150" width="200" height="60" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="520" y="175" font-weight="700">Output layer</text><text x="520" y="196" font-size="11.5">p = softmax(h W2 + b2)</text>
    <rect x="660" y="150" width="120" height="60" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="720" y="175" font-weight="700">Loss L</text><text x="720" y="196" font-size="11.5" fill="#6b7086">cross-entropy</text>
  </g>
  <g fill="none" stroke="#4f5ecb" stroke-width="2" marker-end="url(#ah)">
    <path d="M150,180 L186,180"/><path d="M380,180 L416,180"/><path d="M620,180 L656,180"/>
  </g>
  <path d="M728,240 L80,240" fill="none" stroke="#d97a34" stroke-width="2" marker-end="url(#ao)"/>
  <text x="400" y="264" text-anchor="middle" font-size="12.5" fill="#d97a34" font-weight="700">backward (chain rule): gradients flow from the loss to every weight</text>
  <text x="400" y="284" text-anchor="middle" font-size="11.5" fill="#20222b">dZ2 = p - y,   dW2 = h.T @ dZ2,   dZ1 = (dZ2 @ W2.T) * relu'(Z1),   dW1 = X.T @ dZ1</text>
  <rect x="210" y="304" width="380" height="36" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
  <text x="400" y="327" text-anchor="middle" font-size="12.5" fill="#20222b">update: W = W - lr * dL/dW   (optimizer.step())</text>
  <text x="400" y="378" text-anchor="middle" font-size="11.5" fill="#6b7086">Each layer caches its inputs during the forward pass; the backward pass reuses them.</text>
</svg>
