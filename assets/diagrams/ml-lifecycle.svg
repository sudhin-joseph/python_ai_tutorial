<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="460" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">The Production ML System Lifecycle</text>
  <text x="400" y="54" text-anchor="middle" font-size="12.5" fill="#6b7086">A continuous loop, not a one-time project (DMLS Ch. 1–2)</text>

  <!-- circular layout of 7 stages -->
  <!-- stage boxes -->
  <g font-size="13" font-weight="600" fill="#20222b">
    <rect x="330" y="90" width="140" height="56" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="400" y="113" text-anchor="middle">Business</text>
    <text x="400" y="130" text-anchor="middle">Problem</text>

    <rect x="560" y="140" width="150" height="56" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="635" y="163" text-anchor="middle">ML Objective &amp;</text>
    <text x="635" y="180" text-anchor="middle">Success Metrics</text>

    <rect x="610" y="250" width="140" height="56" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="680" y="273" text-anchor="middle">Data</text>
    <text x="680" y="290" text-anchor="middle">Collection</text>

    <rect x="490" y="350" width="140" height="56" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="560" y="373" text-anchor="middle">Train &amp;</text>
    <text x="560" y="390" text-anchor="middle">Evaluate Model</text>

    <rect x="290" y="380" width="140" height="56" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="360" y="403" text-anchor="middle">Deploy to</text>
    <text x="360" y="420" text-anchor="middle">Production</text>

    <rect x="130" y="300" width="150" height="56" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="205" y="323" text-anchor="middle">Monitor &amp;</text>
    <text x="205" y="340" text-anchor="middle">Detect Drift</text>

    <rect x="90" y="170" width="150" height="56" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="165" y="193" text-anchor="middle">Collect Feedback</text>
    <text x="165" y="210" text-anchor="middle">&amp; Retrain Signal</text>
  </g>

  <!-- connecting arrows roughly circular -->
  <g fill="none" stroke="#4f5ecb" stroke-width="2" marker-end="url(#arrow1)">
    <path d="M465,118 C520,120 555,130 600,150"/>
    <path d="M665,196 C680,215 680,230 680,250"/>
    <path d="M660,306 C630,325 610,335 595,352"/>
    <path d="M495,390 C460,398 450,398 428,402"/>
    <path d="M300,415 C260,400 230,380 215,356"/>
    <path d="M195,300 C180,270 170,245 170,228"/>
    <path d="M230,180 C260,155 290,135 335,120"/>
  </g>

  <text x="400" y="445" text-anchor="middle" font-size="12" fill="#6b7086" font-style="italic">The loop never stops: production data drifts, so monitoring feeds back into retraining and even re-scoping the objective.</text>
</svg>
