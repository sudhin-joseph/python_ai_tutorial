<svg viewBox="0 0 800 390" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/></marker></defs>
  <rect x="0" y="0" width="800" height="390" fill="#f8f9fc"/>
  <text x="400.0" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">The Confusion Matrix</text>
  <text x="400.0" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">Every binary prediction lands in one of four cells</text>
  <text x="340" y="96" font-size="12" text-anchor="middle" font-weight="700" fill="#6b7086">PREDICTED</text>
  <text x="255" y="118" font-size="12" text-anchor="middle" font-weight="700" fill="#20222b">Predicted 0 (negative)</text>
  <text x="425" y="118" font-size="12" text-anchor="middle" font-weight="700" fill="#20222b">Predicted 1 (positive)</text>
  <text x="160" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#20222b">Actual 0</text>
  <text x="160" y="193" font-size="12" text-anchor="end" font-weight="400" fill="#6b7086">(negative)</text>
  <text x="160" y="275" font-size="13" text-anchor="end" font-weight="700" fill="#20222b">Actual 1</text>
  <text x="160" y="293" font-size="12" text-anchor="end" font-weight="400" fill="#6b7086">(positive)</text>
  <rect x="173" y="133" width="164" height="94" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="255" y="176" font-size="13" text-anchor="middle" font-weight="700" fill="#20222b">True Negative (TN)</text>
  <text x="255" y="198" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7086">correctly cleared</text>
  <rect x="343" y="133" width="164" height="94" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
  <text x="425" y="176" font-size="13" text-anchor="middle" font-weight="700" fill="#20222b">False Positive (FP)</text>
  <text x="425" y="198" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7086">false alarm</text>
  <rect x="173" y="233" width="164" height="94" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
  <text x="255" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#20222b">False Negative (FN)</text>
  <text x="255" y="298" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7086">missed positive</text>
  <rect x="343" y="233" width="164" height="94" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
  <text x="425" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#20222b">True Positive (TP)</text>
  <text x="425" y="298" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7086">correctly caught</text>
  <rect x="540" y="130" width="240" height="200" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="556" y="156" font-size="12.5" text-anchor="start" font-weight="700" fill="#20222b">Precision = TP / (TP + FP)</text>
  <text x="556" y="176" font-size="11.5" text-anchor="start" font-weight="400" fill="#6b7086">share of flagged that are real</text>
  <text x="556" y="200" font-size="12.5" text-anchor="start" font-weight="700" fill="#20222b">Recall = TP / (TP + FN)</text>
  <text x="556" y="220" font-size="11.5" text-anchor="start" font-weight="400" fill="#6b7086">share of real positives caught</text>
  <text x="556" y="244" font-size="12.5" text-anchor="start" font-weight="700" fill="#20222b">F1 = 2PR / (P + R)</text>
  <text x="556" y="264" font-size="12.5" text-anchor="start" font-weight="700" fill="#20222b">Accuracy = (TP + TN) / total</text>
  <text x="556" y="284" font-size="12.5" text-anchor="start" font-weight="700" fill="#20222b">FPR = FP / (FP + TN)</text>
  <text x="400" y="368" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7086">scikit-learn: confusion_matrix(y_true, y_pred) returns [[TN, FP], [FN, TP]]</text>
</svg>
