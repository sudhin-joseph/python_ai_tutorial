<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="pyr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Names Point to Objects</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">A variable is a label attached to an object in memory</text>

  <!-- Left panel -->
  <rect x="30" y="80" width="360" height="270" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="210" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Step 1</text>
  <text x="210" y="128" text-anchor="middle" font-size="13" fill="#6b7086">score = 0.91   then   best = score</text>

  <rect x="60" y="160" width="100" height="36" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="110" y="183" text-anchor="middle" font-size="14" font-weight="600" fill="#20222b">score</text>
  <rect x="60" y="240" width="100" height="36" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="110" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#20222b">best</text>

  <rect x="250" y="192" width="110" height="56" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
  <text x="305" y="217" text-anchor="middle" font-size="16" font-weight="700" fill="#20222b">0.91</text>
  <text x="305" y="236" text-anchor="middle" font-size="11.5" fill="#6b7086">float object</text>

  <line x1="160" y1="178" x2="246" y2="206" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyr-arrow)"/>
  <line x1="160" y1="258" x2="246" y2="234" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyr-arrow)"/>

  <text x="210" y="325" text-anchor="middle" font-size="13" fill="#20222b">Two names, one shared object</text>

  <!-- Right panel -->
  <rect x="410" y="80" width="360" height="270" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="590" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Step 2</text>
  <text x="590" y="128" text-anchor="middle" font-size="13" fill="#6b7086">score = 0.95</text>

  <rect x="440" y="160" width="100" height="36" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="490" y="183" text-anchor="middle" font-size="14" font-weight="600" fill="#20222b">score</text>
  <rect x="440" y="240" width="100" height="36" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="490" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#20222b">best</text>

  <rect x="630" y="150" width="110" height="56" rx="10" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
  <text x="685" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#20222b">0.95</text>
  <text x="685" y="194" text-anchor="middle" font-size="11.5" fill="#6b7086">new object</text>

  <rect x="630" y="230" width="110" height="56" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
  <text x="685" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#20222b">0.91</text>
  <text x="685" y="274" text-anchor="middle" font-size="11.5" fill="#6b7086">float object</text>

  <line x1="540" y1="178" x2="626" y2="178" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyr-arrow)"/>
  <line x1="540" y1="258" x2="626" y2="258" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyr-arrow)"/>

  <text x="590" y="325" text-anchor="middle" font-size="13" fill="#20222b">score moved to a new object; best is unchanged</text>
</svg>
