<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="820" height="320" fill="#f8f9fc"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Data Pipeline: From Raw Sources to Training Data</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">DMLS Ch. 3–5: Data Engineering, Training Data, Feature Engineering</text>

  <g font-size="12.5" fill="#20222b">
    <!-- sources -->
    <rect x="20" y="110" width="120" height="100" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="80" y="135" text-anchor="middle" font-weight="700">Sources</text>
    <text x="80" y="155" text-anchor="middle">App DBs</text>
    <text x="80" y="173" text-anchor="middle">Logs / Events</text>
    <text x="80" y="191" text-anchor="middle">Streams (Kafka)</text>

    <rect x="180" y="120" width="120" height="80" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="240" y="150" text-anchor="middle" font-weight="700">ETL / ELT</text>
    <text x="240" y="170" text-anchor="middle">extract · transform</text>
    <text x="240" y="186" text-anchor="middle">· load</text>

    <rect x="340" y="110" width="130" height="100" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="405" y="135" text-anchor="middle" font-weight="700">Storage</text>
    <text x="405" y="155" text-anchor="middle">Data Lake /</text>
    <text x="405" y="173" text-anchor="middle">Warehouse</text>
    <text x="405" y="191" text-anchor="middle">(batch + stream)</text>

    <rect x="510" y="110" width="140" height="100" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="580" y="135" text-anchor="middle" font-weight="700">Labeling &amp;</text>
    <text x="580" y="153" text-anchor="middle">Sampling</text>
    <text x="580" y="173" text-anchor="middle">hand / weak /</text>
    <text x="580" y="191" text-anchor="middle">active learning</text>

    <rect x="690" y="120" width="120" height="80" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="750" y="150" text-anchor="middle" font-weight="700">Feature</text>
    <text x="750" y="168" text-anchor="middle">Engineering</text>
    <text x="750" y="186" text-anchor="middle" font-size="11">&#8594; training data</text>
  </g>

  <g fill="none" stroke="#4f5ecb" stroke-width="2" marker-end="url(#a2)">
    <path d="M140,160 L178,160"/>
    <path d="M300,160 L338,160"/>
    <path d="M470,160 L508,160"/>
    <path d="M650,160 L688,160"/>
  </g>

  <g font-size="11.5" fill="#6b7086">
    <text x="240" y="245" text-anchor="middle">Batch (periodic) vs.</text>
    <text x="240" y="260" text-anchor="middle">stream (real-time) processing</text>
    <text x="580" y="245" text-anchor="middle">Watch for: class imbalance,</text>
    <text x="580" y="260" text-anchor="middle">label noise, sampling bias</text>
    <text x="750" y="245" text-anchor="middle">Watch for:</text>
    <text x="750" y="260" text-anchor="middle">data leakage</text>
  </g>
</svg>
