<svg viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="860" height="440" fill="#f8f9fc"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Diffusion Models &amp; Multimodal Fusion</text>
  <text x="430" y="48" text-anchor="middle" font-size="12.5" fill="#6b7086">GAIA Ch. 10–11</text>

  <!-- Diffusion -->
  <g>
    <text x="220" y="80" text-anchor="middle" font-size="13" font-weight="700">Diffusion: Forward &amp; Reverse Process</text>
    <g>
      <circle cx="60" cy="150" r="30" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
      <text x="60" y="155" text-anchor="middle" font-size="10">Image</text>
      <circle cx="140" cy="150" r="30" fill="#f4f1fb" stroke="#8d7ad6" stroke-width="1.5"/>
      <text x="140" y="155" text-anchor="middle" font-size="9">+noise</text>
      <circle cx="220" cy="150" r="30" fill="#f6eef8" stroke="#a66bc9" stroke-width="1.5"/>
      <text x="220" y="155" text-anchor="middle" font-size="9">+noise</text>
      <circle cx="300" cy="150" r="30" fill="#fdeef5" stroke="#c35ba8" stroke-width="1.5"/>
      <text x="300" y="155" text-anchor="middle" font-size="9">+noise</text>
      <circle cx="380" cy="150" r="30" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
      <text x="380" y="155" text-anchor="middle" font-size="9">pure</text>
      <text x="380" y="167" text-anchor="middle" font-size="9">noise</text>
    </g>
    <g fill="none" stroke="#6b7086" stroke-width="1.5" marker-end="url(#a12)">
      <path d="M92,150 L108,150"/>
      <path d="M172,150 L188,150"/>
      <path d="M252,150 L268,150"/>
      <path d="M332,150 L348,150"/>
    </g>
    <text x="220" y="200" text-anchor="middle" font-size="11" fill="#6b7086">Forward process: training adds noise step by step (fixed, no learning)</text>

    <g fill="none" stroke="#2f9e63" stroke-width="1.8" marker-end="url(#a12)">
      <path d="M348,235 L92,235"/>
    </g>
    <text x="220" y="255" text-anchor="middle" font-size="11" fill="#2f9e63" font-weight="600">Reverse process: U-Net predicts &amp; removes noise, step by step</text>
    <text x="220" y="275" text-anchor="middle" font-size="10.5" fill="#6b7086">Text prompt conditions each denoising step (cross-attention)</text>
  </g>

  <!-- Multimodal fusion -->
  <g>
    <text x="660" y="80" text-anchor="middle" font-size="13" font-weight="700">Multimodal Fusion</text>
    <rect x="560" y="110" width="110" height="42" rx="7" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="615" y="135" text-anchor="middle" font-size="11">Text Encoder</text>
    <rect x="690" y="110" width="110" height="42" rx="7" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="745" y="135" text-anchor="middle" font-size="11">Image Encoder</text>
    <rect x="610" y="190" width="170" height="50" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="695" y="212" text-anchor="middle" font-size="11">Cross-Attention /</text>
    <text x="695" y="228" text-anchor="middle" font-size="11">Fusion Layer</text>
    <rect x="630" y="270" width="130" height="42" rx="7" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="695" y="296" text-anchor="middle" font-size="11">Joint Output</text>
  </g>
  <g fill="none" stroke="#4f5ecb" stroke-width="1.8" marker-end="url(#a12)">
    <path d="M630,152 C650,165 665,175 680,188"/>
    <path d="M745,152 C740,165 730,175 715,188"/>
    <path d="M695,240 L695,268"/>
  </g>
  <text x="660" y="340" text-anchor="middle" font-size="11" fill="#6b7086">Use cases: visual Q&amp;A, image</text>
  <text x="660" y="356" text-anchor="middle" font-size="11" fill="#6b7086">captioning, multimodal RAG</text>

  <text x="430" y="410" text-anchor="middle" font-size="11.5" fill="#6b7086">Optional specialization — most teams don't need this unless the product generates or reasons over images/video.</text>
</svg>
