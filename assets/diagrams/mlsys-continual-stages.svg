<svg viewBox="0 0 900 345" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="mcsa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="900" height="345" fill="#f8f9fc"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">The Four Stages of Continual Learning</text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">DMLS Ch. 9: most teams climb these steps over years, not weeks</text>

  <g font-size="12" fill="#20222b" text-anchor="middle">
    <rect x="20" y="210" width="195" height="90" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="117" y="232" font-size="13" font-weight="700">Stage 1</text>
    <text x="117" y="252">Manual, stateless</text>
    <text x="117" y="268">retraining</text>
    <text x="117" y="287" font-size="11.5" fill="#6b7086">ad hoc, months apart</text>

    <rect x="245" y="170" width="195" height="90" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="342" y="192" font-size="13" font-weight="700">Stage 2</text>
    <text x="342" y="212">Automated retraining</text>
    <text x="342" y="228">scheduled script</text>
    <text x="342" y="247" font-size="11.5" fill="#6b7086">e.g. nightly, from scratch</text>

    <rect x="470" y="130" width="195" height="90" rx="10" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="567" y="152" font-size="13" font-weight="700">Stage 3</text>
    <text x="567" y="172">Automated, stateful</text>
    <text x="567" y="188">fine-tune last checkpoint</text>
    <text x="567" y="207" font-size="11.5" fill="#6b7086">on new data only</text>

    <rect x="695" y="90" width="195" height="90" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.8"/>
    <text x="792" y="112" font-size="13" font-weight="700">Stage 4</text>
    <text x="792" y="132">Continual learning</text>
    <text x="792" y="148">update when triggered</text>
    <text x="792" y="167" font-size="11.5" fill="#6b7086">by drift, perf. or volume</text>
  </g>

  <g stroke="#4f5ecb" stroke-width="1.8" fill="none" marker-end="url(#mcsa)">
    <line x1="215" y1="245" x2="241" y2="225"/>
    <line x1="440" y1="205" x2="466" y2="185"/>
    <line x1="665" y1="165" x2="691" y2="145"/>
  </g>

  <text x="450" y="328" text-anchor="middle" font-size="12" fill="#6b7086">Each step needs more infrastructure: a scheduler, a model store, lineage tracking, then solid monitoring and triggers.</text>
</svg>
