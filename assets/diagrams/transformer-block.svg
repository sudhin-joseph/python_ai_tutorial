<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Simplified Transformer Decoder Block</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">AIE Ch. 2 context — architecture itself is outside the books' scope (see external refs)</text>

  <g font-size="12.5" fill="#20222b">
    <rect x="300" y="435" width="200" height="40" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="400" y="460" text-anchor="middle">Input tokens: "The cat sat"</text>

    <rect x="300" y="375" width="200" height="40" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="400" y="400" text-anchor="middle">Token + Positional Embedding</text>

    <!-- repeated block -->
    <rect x="230" y="195" width="340" height="150" rx="12" fill="#f3f4fd" stroke="#4f5ecb" stroke-dasharray="5,4" stroke-width="1.5"/>
    <text x="585" y="274" text-anchor="start" font-size="11.5" fill="#4f5ecb" font-weight="700">&#215; N layers</text>

    <rect x="260" y="295" width="280" height="40" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="400" y="320" text-anchor="middle">Multi-Head Self-Attention</text>

    <rect x="320" y="245" width="160" height="30" rx="6" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.2"/>
    <text x="400" y="265" text-anchor="middle" font-size="11.5">Add &amp; Norm</text>

    <rect x="260" y="205" width="280" height="30" rx="6" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="400" y="225" text-anchor="middle">Feed-Forward Network</text>

    <rect x="300" y="135" width="200" height="34" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="400" y="157" text-anchor="middle">Output logits → Sampling</text>

    <rect x="290" y="75" width="220" height="34" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="400" y="97" text-anchor="middle" font-size="12">Next token (temperature / top-p)</text>
  </g>

  <g fill="none" stroke="#4f5ecb" stroke-width="2" marker-end="url(#a6)">
    <path d="M400,433 L400,417"/>
    <path d="M400,373 L400,347"/>
    <path d="M400,293 L400,277"/>
    <path d="M400,243 L400,237"/>
    <path d="M400,203 L400,171"/>
    <path d="M400,133 L400,111"/>
  </g>
  <text x="400" y="486" text-anchor="middle" font-size="11.5" fill="#6b7086">Attention lets every token weigh every other token; stacking N of these blocks builds the full model.</text>
</svg>
