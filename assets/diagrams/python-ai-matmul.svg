<text x="617" y="124" text-anchor="middle" font-size="12" fill="#20222b" font-weight="700">C[0, 1] = row 0 of A · column 1 of B</text>
<text x="617" y="148" text-anchor="middle" font-size="12" fill="#20222b" font-weight="400">= 1×0 + 2×1 + 3×2</text>
<text x="617" y="172" text-anchor="middle" font-size="12" fill="#20222b" font-weight="400">= 8</text>
<text x="106" y="228" text-anchor="middle" font-size="14" fill="#20222b" font-weight="400">(2 × 3)</text>
<text x="269" y="228" text-anchor="middle" font-size="14" fill="#20222b" font-weight="400">(3 × 2)</text>
<text x="419" y="228" text-anchor="middle" font-size="14" fill="#20222b" font-weight="400">(2 × 2)</text>
<text x="380" y="276" text-anchor="middle" font-size="12" fill="#6b7086" font-weight="400">inner sizes 3 and 3 match and disappear; outer sizes 2 and 2 give the result shape</text>
<text x="380" y="302" text-anchor="middle" font-size="12" fill="#6b7086" font-weight="400">blue row · orange column = green cell</text>
