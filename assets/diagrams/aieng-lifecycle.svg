<svg viewBox="0 0 910 290" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/></marker></defs>
<rect width="910" height="290" fill="#f8f9fc"/>
<text x="455" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Generative AI Project Lifecycle</text>
<text x="455" y="52" text-anchor="middle" font-size="12" fill="#6b7086">GAIA Ch. 1 · AIE Ch. 1</text>
<rect x="19" y="92" width="132" height="70" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
<text x="85.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">1. Scope</text>
<text x="85.0" y="142" text-anchor="middle" font-size="11" fill="#6b7086">use case, success</text>
<line x1="152" y1="127.0" x2="166" y2="127.0" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#al)"/>
<rect x="167" y="92" width="132" height="70" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
<text x="233.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">2. Select</text>
<text x="233.0" y="142" text-anchor="middle" font-size="11" fill="#6b7086">shortlist models</text>
<line x1="300" y1="127.0" x2="314" y2="127.0" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#al)"/>
<rect x="315" y="92" width="132" height="70" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
<text x="381.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">3. Adapt</text>
<text x="381.0" y="142" text-anchor="middle" font-size="11" fill="#6b7086">prompt, RAG, tune</text>
<line x1="448" y1="127.0" x2="462" y2="127.0" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#al)"/>
<rect x="463" y="92" width="132" height="70" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
<text x="529.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">4. Evaluate</text>
<text x="529.0" y="142" text-anchor="middle" font-size="11" fill="#6b7086">golden set, judges</text>
<line x1="596" y1="127.0" x2="610" y2="127.0" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#al)"/>
<rect x="611" y="92" width="132" height="70" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
<text x="677.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">5. Deploy</text>
<text x="677.0" y="142" text-anchor="middle" font-size="11" fill="#6b7086">serve, guardrails</text>
<line x1="744" y1="127.0" x2="758" y2="127.0" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#al)"/>
<rect x="759" y="92" width="132" height="70" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
<text x="825.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">6. Monitor</text>
<text x="825.0" y="142" text-anchor="middle" font-size="11" fill="#6b7086">logs, feedback</text>
<path d="M825.0,164 L825.0,200 L381.0,200 L381.0,166" fill="none" stroke="#2f9e63" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#al)"/>
<text x="603.0" y="222" text-anchor="middle" font-size="12" fill="#2f9e63">feedback: production failures become new test cases, prompts and fine-tuning data</text>
<text x="455" y="266" text-anchor="middle" font-size="12" fill="#6b7086">Evaluation gates every move to the right. Expect many Adapt → Evaluate loops before the first deploy.</text>
</svg>