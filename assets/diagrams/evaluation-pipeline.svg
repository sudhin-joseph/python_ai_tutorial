<svg viewBox="0 0 820 370" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="820" height="370" fill="#f8f9fc"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Evaluating a Generative AI System</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">AIE Ch. 3–4</text>

  <g font-size="12.5" fill="#20222b">
    <rect x="30" y="170" width="130" height="60" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="95" y="195" text-anchor="middle" font-weight="700">Test Set</text>
    <text x="95" y="213" text-anchor="middle" font-size="11">curated prompts</text>

    <rect x="200" y="170" width="130" height="60" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="265" y="195" text-anchor="middle" font-weight="700">Model</text>
    <text x="265" y="213" text-anchor="middle" font-size="11">generates output</text>

    <!-- 3 parallel eval methods -->
    <rect x="380" y="80" width="160" height="55" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="460" y="103" text-anchor="middle" font-weight="700" font-size="12">Automatic Metrics</text>
    <text x="460" y="120" text-anchor="middle" font-size="11">exact match, similarity</text>

    <rect x="380" y="170" width="160" height="55" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="460" y="193" text-anchor="middle" font-weight="700" font-size="12">AI-as-Judge</text>
    <text x="460" y="210" text-anchor="middle" font-size="11">LLM scores output</text>

    <rect x="380" y="260" width="160" height="55" rx="10" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="460" y="283" text-anchor="middle" font-weight="700" font-size="12">Human Evaluation</text>
    <text x="460" y="300" text-anchor="middle" font-size="11">spot-check / rubric</text>

    <rect x="610" y="170" width="170" height="60" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="695" y="195" text-anchor="middle" font-weight="700">Aggregate Score</text>
    <text x="695" y="213" text-anchor="middle" font-size="11">per-slice + overall</text>
  </g>

  <g fill="none" stroke="#4f5ecb" stroke-width="2" marker-end="url(#a7)">
    <path d="M160,200 L198,200"/>
    <path d="M330,190 C350,160 360,130 378,110"/>
    <path d="M330,200 L378,200"/>
    <path d="M330,210 C350,240 360,270 378,288"/>
    <path d="M540,110 C580,130 595,150 608,180"/>
    <path d="M540,200 L608,200"/>
    <path d="M540,288 C580,260 595,240 608,220"/>
  </g>
  <text x="410" y="353" text-anchor="middle" font-size="11.5" fill="#6b7086">Mix methods: automatic metrics scale cheaply, human eval catches what metrics miss, AI judges split the difference.</text>
</svg>
