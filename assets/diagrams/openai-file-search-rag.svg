<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="fsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#f8f9fc"/>
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">RAG with Hosted File Search</text>
  <text x="430" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">Ingest once into a vector store, then let the model search it at question time</text>

  <!-- Ingest lane -->
  <rect x="20" y="78" width="820" height="150" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="40" y="102" font-size="13.5" font-weight="700" fill="#20222b">A. Ingestion (run once, or whenever documents change)</text>

  <rect x="40" y="120" width="160" height="86" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.3"/>
  <text x="120" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">Your documents</text>
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#6b7086">PDF, DOCX, MD, TXT</text>

  <rect x="250" y="120" width="170" height="86" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.3"/>
  <text x="335" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">Upload</text>
  <text x="335" y="168" text-anchor="middle" font-size="11" fill="#6b7086">vector_stores.files</text>
  <text x="335" y="184" text-anchor="middle" font-size="11" fill="#6b7086">.upload_and_poll()</text>

  <rect x="470" y="120" width="350" height="86" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.3"/>
  <text x="645" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">Vector store (vs_...) managed by OpenAI</text>
  <text x="645" y="168" text-anchor="middle" font-size="11.5" fill="#20222b">parse → chunk (800 tokens, 400 overlap)</text>
  <text x="645" y="186" text-anchor="middle" font-size="11.5" fill="#20222b">→ embed → index (semantic + keyword)</text>

  <!-- Query lane -->
  <rect x="20" y="250" width="820" height="160" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="40" y="274" font-size="13.5" font-weight="700" fill="#20222b">B. Question time (every request)</text>

  <rect x="40" y="292" width="160" height="96" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.3"/>
  <text x="120" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">User question</text>
  <text x="120" y="350" text-anchor="middle" font-size="11" fill="#6b7086">"What is the refund</text>
  <text x="120" y="365" text-anchor="middle" font-size="11" fill="#6b7086">window?"</text>

  <rect x="250" y="292" width="170" height="96" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.3"/>
  <text x="335" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">responses.create</text>
  <text x="335" y="340" text-anchor="middle" font-size="11" fill="#6b7086">tools=[file_search,</text>
  <text x="335" y="356" text-anchor="middle" font-size="11" fill="#6b7086">vector_store_ids]</text>

  <rect x="470" y="292" width="160" height="96" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.3"/>
  <text x="550" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">file_search_call</text>
  <text x="550" y="340" text-anchor="middle" font-size="11" fill="#6b7086">model writes queries,</text>
  <text x="550" y="356" text-anchor="middle" font-size="11" fill="#6b7086">top chunks returned</text>

  <rect x="670" y="292" width="150" height="96" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.3"/>
  <text x="745" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">Answer</text>
  <text x="745" y="340" text-anchor="middle" font-size="11" fill="#6b7086">output_text with</text>
  <text x="745" y="356" text-anchor="middle" font-size="11" fill="#6b7086">file_citation notes</text>

  <g stroke="#4f5ecb" stroke-width="1.7" fill="none">
    <line x1="202" y1="163" x2="246" y2="163" marker-end="url(#fsA)"/>
    <line x1="422" y1="163" x2="466" y2="163" marker-end="url(#fsA)"/>
    <line x1="202" y1="340" x2="246" y2="340" marker-end="url(#fsA)"/>
    <line x1="422" y1="340" x2="466" y2="340" marker-end="url(#fsA)"/>
    <line x1="632" y1="340" x2="666" y2="340" marker-end="url(#fsA)"/>
    <line x1="550" y1="290" x2="550" y2="210" stroke-dasharray="5,4" marker-end="url(#fsA)"/>
  </g>
  <text x="560" y="240" font-size="11" fill="#6b7086">searches</text>

  <text x="430" y="446" text-anchor="middle" font-size="11.5" fill="#6b7086">Do-it-yourself RAG swaps the vector store for embeddings + your own index; the shape stays the same.</text>
</svg>
