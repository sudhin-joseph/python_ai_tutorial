<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#f8f9fc"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Model Development &amp; Deployment</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">DMLS Ch. 6–7: Offline Evaluation, Deployment &amp; Prediction Service</text>

  <g font-size="12.5" fill="#20222b">
    <rect x="30" y="110" width="130" height="70" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="95" y="140" text-anchor="middle" font-weight="700">Train Candidate</text>
    <text x="95" y="158" text-anchor="middle">Models</text>

    <rect x="210" y="110" width="150" height="70" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="285" y="135" text-anchor="middle" font-weight="700">Offline Evaluation</text>
    <text x="285" y="153" text-anchor="middle" font-size="11">slice-based · perturbation</text>
    <text x="285" y="169" text-anchor="middle" font-size="11">· invariance tests</text>

    <rect x="410" y="110" width="140" height="70" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="480" y="140" text-anchor="middle" font-weight="700">Model Registry</text>
    <text x="480" y="158" text-anchor="middle" font-size="11">versioned artifacts</text>

    <!-- branch -->
    <rect x="610" y="50" width="170" height="70" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="695" y="75" text-anchor="middle" font-weight="700">Batch Prediction</text>
    <text x="695" y="93" text-anchor="middle" font-size="11">precompute &amp; store</text>
    <text x="695" y="108" text-anchor="middle" font-size="11">(high throughput)</text>

    <rect x="610" y="170" width="170" height="70" rx="10" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="695" y="195" text-anchor="middle" font-weight="700">Online Prediction</text>
    <text x="695" y="213" text-anchor="middle" font-size="11">real-time REST/gRPC</text>
    <text x="695" y="228" text-anchor="middle" font-size="11">(low latency)</text>

    <rect x="660" y="290" width="120" height="50" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="720" y="320" text-anchor="middle">Client / App</text>
  </g>

  <g fill="none" stroke="#4f5ecb" stroke-width="2" marker-end="url(#a3)">
    <path d="M160,145 L208,145"/>
    <path d="M360,145 L408,145"/>
    <path d="M550,135 C575,120 585,105 608,90"/>
    <path d="M550,155 C575,175 585,190 608,205"/>
    <path d="M720,240 L720,288"/>
  </g>
  <text x="410" y="382" text-anchor="middle" font-size="11.5" fill="#6b7086">Choose batch vs. online based on freshness needs, latency budget, and infrastructure cost — not by default habit.</text>
</svg>
