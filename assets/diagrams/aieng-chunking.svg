<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="420" fill="#f8f9fc"/>
<text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Three Chunking Strategies for RAG</text>
<text x="450" y="52" text-anchor="middle" font-size="12" fill="#6b7086">AIE Ch. 6 · GAIA Ch. 9</text>
<rect x="30" y="80" width="270" height="290" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
<text x="165.0" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Fixed size + overlap</text>
<text x="45" y="134" font-size="11" fill="#6b7086">document</text>
<rect x="45" y="142" width="240" height="18" rx="3" fill="#eef0fd" stroke="#4f5ecb"/>
<text x="45" y="290" font-size="12" fill="#20222b">Split every N tokens; repeat the</text>
<text x="45" y="308" font-size="12" fill="#20222b">last M tokens in the next chunk.</text>
<text x="45" y="326" font-size="12" fill="#20222b">Simple and predictable, but can</text>
<text x="45" y="344" font-size="12" fill="#20222b">cut a sentence or table in half.</text>
<rect x="315" y="80" width="270" height="290" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
<text x="450.0" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Recursive / sentence-aware</text>
<text x="330" y="134" font-size="11" fill="#6b7086">document</text>
<rect x="330" y="142" width="240" height="18" rx="3" fill="#eef0fd" stroke="#4f5ecb"/>
<text x="330" y="290" font-size="12" fill="#20222b">Split on paragraphs, then sentences,</text>
<text x="330" y="308" font-size="12" fill="#20222b">then words, until chunks fit the</text>
<text x="330" y="326" font-size="12" fill="#20222b">size limit. Keeps thoughts intact;</text>
<text x="330" y="344" font-size="12" fill="#20222b">chunk sizes vary.</text>
<rect x="600" y="80" width="270" height="290" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
<text x="735.0" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">Structure-aware</text>
<text x="615" y="134" font-size="11" fill="#6b7086">document</text>
<rect x="615" y="142" width="240" height="18" rx="3" fill="#eef0fd" stroke="#4f5ecb"/>
<text x="615" y="290" font-size="12" fill="#20222b">Split on document structure:</text>
<text x="615" y="308" font-size="12" fill="#20222b">headings, sections, code blocks.</text>
<text x="615" y="326" font-size="12" fill="#20222b">Attach the heading path as metadata</text>
<text x="615" y="344" font-size="12" fill="#20222b">so each chunk keeps its context.</text>
<rect x="45" y="176" width="100" height="20" rx="3" fill="#fff4ea" stroke="#d97a34"/>
<text x="95" y="190" text-anchor="middle" font-size="11" fill="#20222b">chunk 1</text>
<rect x="115" y="204" width="100" height="20" rx="3" fill="#fff4ea" stroke="#d97a34"/>
<text x="165" y="218" text-anchor="middle" font-size="11" fill="#20222b">chunk 2</text>
<rect x="185" y="232" width="100" height="20" rx="3" fill="#fff4ea" stroke="#d97a34"/>
<text x="235" y="246" text-anchor="middle" font-size="11" fill="#20222b">chunk 3</text>
<rect x="330" y="176" width="64" height="20" rx="3" fill="#eef7f0" stroke="#2f9e63"/>
<text x="362.0" y="190" text-anchor="middle" font-size="11" fill="#20222b">chunk 1</text>
<rect x="394" y="204" width="104" height="20" rx="3" fill="#eef7f0" stroke="#2f9e63"/>
<text x="446.0" y="218" text-anchor="middle" font-size="11" fill="#20222b">chunk 2</text>
<rect x="498" y="232" width="72" height="20" rx="3" fill="#eef7f0" stroke="#2f9e63"/>
<text x="534.0" y="246" text-anchor="middle" font-size="11" fill="#20222b">chunk 3</text>
<rect x="615" y="176" width="240" height="20" rx="3" fill="#eef0fd" stroke="#4f5ecb"/>
<text x="625" y="190" font-size="11" fill="#20222b"># Returns > Policy</text>
<rect x="615" y="204" width="240" height="20" rx="3" fill="#eef0fd" stroke="#4f5ecb"/>
<text x="625" y="218" font-size="11" fill="#20222b"># Returns > Electronics</text>
<rect x="615" y="232" width="240" height="20" rx="3" fill="#eef0fd" stroke="#4f5ecb"/>
<text x="625" y="246" font-size="11" fill="#20222b"># Shipping > Express</text>
<text x="450" y="404" text-anchor="middle" font-size="12" fill="#6b7086">Typical sizes: 200–1,000 tokens with 10–20% overlap. Evaluate retrieval to choose; there is no universal best.</text>
</svg>