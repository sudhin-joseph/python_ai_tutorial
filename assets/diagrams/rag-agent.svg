<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="860" height="480" fill="#f8f9fc"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">RAG Pipeline &amp; Agent Loop</text>
  <text x="430" y="48" text-anchor="middle" font-size="12.5" fill="#6b7086">AIE Ch. 6 · GAIA Ch. 9</text>

  <!-- RAG panel -->
  <g>
    <rect x="20" y="70" width="400" height="220" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="220" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#20222b">RAG: Retrieval-Augmented Generation</text>

    <g font-size="11.5" fill="#20222b">
      <rect x="40" y="110" width="100" height="42" rx="7" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.3"/>
      <text x="90" y="128" text-anchor="middle">Documents</text>
      <text x="90" y="142" text-anchor="middle" font-size="10">chunk + embed</text>

      <rect x="160" y="110" width="100" height="42" rx="7" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.3"/>
      <text x="210" y="135" text-anchor="middle">Vector DB</text>

      <rect x="40" y="195" width="100" height="42" rx="7" fill="#fff4ea" stroke="#d97a34" stroke-width="1.3"/>
      <text x="90" y="213" text-anchor="middle">User Query</text>
      <text x="90" y="227" text-anchor="middle" font-size="10">embed query</text>

      <rect x="160" y="195" width="100" height="42" rx="7" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.3"/>
      <text x="210" y="213" text-anchor="middle">Retrieve top-k</text>
      <text x="210" y="227" text-anchor="middle" font-size="10">+ re-rank</text>

      <rect x="290" y="150" width="110" height="60" rx="7" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.3"/>
      <text x="345" y="172" text-anchor="middle">Augmented</text>
      <text x="345" y="186" text-anchor="middle">Prompt → LLM</text>
      <text x="345" y="200" text-anchor="middle" font-size="10">→ grounded answer</text>
    </g>
    <g fill="none" stroke="#4f5ecb" stroke-width="1.8" marker-end="url(#a8)">
      <path d="M140,131 L158,131"/>
      <path d="M140,216 L158,216"/>
      <path d="M210,152 C210,170 210,175 212,193"/>
      <path d="M260,216 C275,200 280,195 288,185"/>
    </g>
  </g>

  <!-- Agent panel -->
  <g>
    <rect x="440" y="70" width="400" height="220" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="640" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#20222b">Agent Loop: Think → Act → Observe</text>

    <circle cx="640" cy="180" r="85" fill="none" stroke="#e4e5ea" stroke-width="1"/>
    <g font-size="11.5" fill="#20222b">
      <rect x="595" y="100" width="90" height="42" rx="7" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.3"/>
      <text x="640" y="125" text-anchor="middle">Think / Plan</text>

      <rect x="700" y="160" width="90" height="42" rx="7" fill="#fff4ea" stroke="#d97a34" stroke-width="1.3"/>
      <text x="745" y="185" text-anchor="middle">Act (tool call)</text>

      <rect x="595" y="218" width="90" height="42" rx="7" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.3"/>
      <text x="640" y="243" text-anchor="middle">Observe result</text>

      <rect x="490" y="160" width="90" height="42" rx="7" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.3"/>
      <text x="535" y="178" text-anchor="middle">Final</text>
      <text x="535" y="192" text-anchor="middle">Answer</text>
    </g>
    <g fill="none" stroke="#4f5ecb" stroke-width="1.8" marker-end="url(#a8)">
      <path d="M685,130 C705,140 715,150 725,160"/>
      <path d="M745,202 C710,215 695,220 685,228"/>
      <path d="M595,235 C560,220 545,210 540,204"/>
      <path d="M580,172 C585,155 590,145 597,130"/>
    </g>
  </g>

  <text x="430" y="330" text-anchor="middle" font-size="12" fill="#20222b" font-weight="600">Diagnose which one is failing:</text>
  <text x="430" y="352" text-anchor="middle" font-size="11.5" fill="#6b7086">Bad retrieval → wrong/missing context reaches the model.  Bad generation → right context, model still answers poorly.</text>
  <text x="430" y="374" text-anchor="middle" font-size="11.5" fill="#6b7086">An agent with tool access multiplies blast radius — guardrail every side-effecting tool call.</text>
</svg>
