<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="700" height="420" fill="#f8f9fc"/>
  <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">MLOps Infrastructure Stack</text>
  <text x="350" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">DMLS Ch. 10 — read bottom-up, each layer builds on the one below</text>

  <g font-size="13" font-weight="600" fill="#20222b">
    <rect x="100" y="340" width="500" height="50" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="350" y="370" text-anchor="middle">Storage &amp; Compute (object storage, GPUs/TPUs, elastic clusters)</text>

    <rect x="100" y="284" width="500" height="50" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="350" y="314" text-anchor="middle">Resource Management (schedulers: Kubernetes, Slurm, Ray)</text>

    <rect x="100" y="228" width="500" height="50" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="350" y="258" text-anchor="middle">Orchestration (workflow DAGs: Airflow, Kubeflow, Metaflow)</text>

    <rect x="100" y="172" width="240" height="50" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="220" y="202" text-anchor="middle" font-size="12.5">Feature Store</text>

    <rect x="360" y="172" width="240" height="50" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="480" y="202" text-anchor="middle" font-size="12.5">Model Store / Registry</text>

    <rect x="100" y="116" width="500" height="50" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="350" y="146" text-anchor="middle">Dev Environment &amp; CI/CD (notebooks, experiment tracking, tests)</text>

    <rect x="100" y="70" width="500" height="40" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="350" y="95" text-anchor="middle">Serving &amp; Monitoring (the layer users/clients actually touch)</text>
  </g>
</svg>
