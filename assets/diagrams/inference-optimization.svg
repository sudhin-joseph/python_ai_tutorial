<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="860" height="420" fill="#f8f9fc"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Inference Optimization: Three Levers</text>
  <text x="430" y="48" text-anchor="middle" font-size="12.5" fill="#6b7086">AIE Ch. 9 · GAIA Ch. 8</text>

  <!-- KV cache -->
  <g>
    <rect x="20" y="70" width="260" height="310" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="150" y="95" text-anchor="middle" font-size="13" font-weight="700">KV Caching</text>
    <text x="150" y="115" text-anchor="middle" font-size="10.5" fill="#6b7086">reuse past keys/values</text>
    <g font-size="11">
      <rect x="40" y="135" width="40" height="30" fill="#eef0fd" stroke="#4f5ecb"/>
      <text x="60" y="155" text-anchor="middle">T1</text>
      <rect x="90" y="135" width="40" height="30" fill="#eef0fd" stroke="#4f5ecb"/>
      <text x="110" y="155" text-anchor="middle">T2</text>
      <rect x="140" y="135" width="40" height="30" fill="#fff4ea" stroke="#d97a34"/>
      <text x="160" y="155" text-anchor="middle">T3</text>
      <text x="150" y="182" text-anchor="middle" fill="#6b7086" font-size="10">cached K,V →</text>
      <text x="150" y="196" text-anchor="middle" fill="#6b7086" font-size="10">only new token computed</text>
    </g>
    <text x="150" y="230" text-anchor="middle" font-size="11" fill="#20222b">Without cache: O(n²) recompute</text>
    <text x="150" y="247" text-anchor="middle" font-size="11" fill="#20222b">With cache: O(n) per new token</text>
    <text x="150" y="275" text-anchor="middle" font-size="10.5" fill="#6b7086">Trade-off: memory grows</text>
    <text x="150" y="291" text-anchor="middle" font-size="10.5" fill="#6b7086">linearly with sequence length</text>
  </g>

  <!-- Batching -->
  <g>
    <rect x="300" y="70" width="260" height="310" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="430" y="95" text-anchor="middle" font-size="13" font-weight="700">Batching</text>
    <text x="430" y="115" text-anchor="middle" font-size="10.5" fill="#6b7086">group requests into one pass</text>
    <g font-size="10.5">
      <rect x="320" y="130" width="90" height="24" rx="5" fill="#eef7f0" stroke="#2f9e63"/>
      <text x="365" y="146" text-anchor="middle">Request A</text>
      <rect x="320" y="160" width="90" height="24" rx="5" fill="#eef7f0" stroke="#2f9e63"/>
      <text x="365" y="176" text-anchor="middle">Request B</text>
      <rect x="320" y="190" width="90" height="24" rx="5" fill="#eef7f0" stroke="#2f9e63"/>
      <text x="365" y="206" text-anchor="middle">Request C</text>
      <text x="430" y="170" font-size="16" fill="#4f5ecb">→</text>
      <rect x="450" y="150" width="90" height="50" rx="7" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
      <text x="495" y="170" text-anchor="middle">Batched</text>
      <text x="495" y="186" text-anchor="middle">forward pass</text>
    </g>
    <text x="430" y="245" text-anchor="middle" font-size="11">↑ throughput, ↑ per-request latency</text>
    <text x="430" y="265" text-anchor="middle" font-size="10.5" fill="#6b7086">Continuous/dynamic batching reduces</text>
    <text x="430" y="281" text-anchor="middle" font-size="10.5" fill="#6b7086">the wait for a full batch to form</text>
  </g>

  <!-- Quantization -->
  <g>
    <rect x="580" y="70" width="260" height="310" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="710" y="95" text-anchor="middle" font-size="13" font-weight="700">Quantization</text>
    <text x="710" y="115" text-anchor="middle" font-size="10.5" fill="#6b7086">lower-precision weights</text>
    <g font-size="10.5" fill="#20222b">
      <rect x="605" y="135" width="210" height="22" fill="#fff4ea" stroke="#d97a34"/>
      <text x="710" y="150" text-anchor="middle">FP32 — 4 bytes/param</text>
      <rect x="605" y="162" width="160" height="22" fill="#fff4ea" stroke="#d97a34"/>
      <text x="685" y="177" text-anchor="middle">FP16/BF16 — 2 bytes</text>
      <rect x="605" y="189" width="90" height="22" fill="#eef0fd" stroke="#4f5ecb"/>
      <text x="650" y="204" text-anchor="middle">INT8 — 1 byte</text>
      <rect x="605" y="216" width="50" height="22" fill="#eef7f0" stroke="#2f9e63"/>
      <text x="630" y="231" text-anchor="middle" font-size="9.5">INT4</text>
    </g>
    <text x="710" y="260" text-anchor="middle" font-size="11">Smaller footprint → fits on</text>
    <text x="710" y="276" text-anchor="middle" font-size="11">cheaper GPUs, runs faster</text>
    <text x="710" y="300" text-anchor="middle" font-size="10.5" fill="#6b7086">Trade-off: some accuracy loss</text>
    <text x="710" y="316" text-anchor="middle" font-size="10.5" fill="#6b7086">(distillation is the alternative —</text>
    <text x="710" y="332" text-anchor="middle" font-size="10.5" fill="#6b7086">train a smaller model to mimic a larger one)</text>
  </g>
  <text x="430" y="405" text-anchor="middle" font-size="11.5" fill="#6b7086">These levers combine: a quantized model, batched and KV-cached, is the standard production recipe.</text>
</svg>
