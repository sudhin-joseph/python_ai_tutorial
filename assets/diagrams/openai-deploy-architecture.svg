<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="daA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="860" height="500" fill="#f8f9fc"/>
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Deployed Document Q&amp;A Assistant</text>
  <text x="430" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">The browser never sees the API key: only your backend talks to OpenAI</text>

  <!-- client -->
  <rect x="20" y="170" width="150" height="90" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.4"/>
  <text x="95" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Browser / app</text>
  <text x="95" y="225" text-anchor="middle" font-size="11" fill="#6b7086">POST /ask</text>
  <text x="95" y="241" text-anchor="middle" font-size="11" fill="#6b7086">reads SSE stream</text>

  <!-- cloud run box -->
  <rect x="220" y="80" width="330" height="270" rx="12" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="385" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#20222b">Container platform (e.g. Cloud Run)</text>
  <text x="385" y="122" text-anchor="middle" font-size="11" fill="#6b7086">HTTPS, autoscaling 0..N instances</text>

  <rect x="245" y="138" width="280" height="130" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.3"/>
  <text x="385" y="160" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">FastAPI container (uvicorn)</text>
  <g font-size="11.5" fill="#20222b">
    <text x="262" y="184">• validate input (pydantic, size limits)</text>
    <text x="262" y="204">• /chat and /ask (RAG) endpoints</text>
    <text x="262" y="224">• stream tokens as server-sent events</text>
    <text x="262" y="244">• timeouts, retries, structured logs</text>
  </g>
  <rect x="245" y="282" width="280" height="50" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.3"/>
  <text x="385" y="303" text-anchor="middle" font-size="12" fill="#20222b">env: OPENAI_API_KEY, OPENAI_MODEL,</text>
  <text x="385" y="320" text-anchor="middle" font-size="12" fill="#20222b">VECTOR_STORE_ID (injected at start)</text>

  <!-- openai -->
  <rect x="610" y="140" width="230" height="150" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.4"/>
  <text x="725" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">OpenAI API</text>
  <g font-size="11.5" fill="#20222b" text-anchor="middle">
    <text x="725" y="192">Responses (+ file_search)</text>
    <text x="725" y="212">Vector store with your docs</text>
    <text x="725" y="232">Moderations</text>
    <text x="725" y="258" fill="#6b7086">project-scoped key,</text>
    <text x="725" y="274" fill="#6b7086">spend limit + alerts</text>
  </g>

  <!-- bottom row -->
  <rect x="220" y="390" width="190" height="60" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.3"/>
  <text x="315" y="416" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">Secret manager</text>
  <text x="315" y="434" text-anchor="middle" font-size="11" fill="#6b7086">stores the API key</text>

  <rect x="440" y="390" width="190" height="60" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.3"/>
  <text x="535" y="416" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">Logs + metrics</text>
  <text x="535" y="434" text-anchor="middle" font-size="11" fill="#6b7086">latency, errors, tokens</text>

  <rect x="660" y="390" width="180" height="60" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.3"/>
  <text x="750" y="416" text-anchor="middle" font-size="12.5" font-weight="700" fill="#20222b">Image registry</text>
  <text x="750" y="434" text-anchor="middle" font-size="11" fill="#6b7086">built from Dockerfile</text>

  <g stroke="#4f5ecb" stroke-width="1.7" fill="none">
    <line x1="172" y1="203" x2="241" y2="203" marker-end="url(#daA)"/>
    <line x1="241" y1="230" x2="174" y2="230" marker-end="url(#daA)"/>
    <line x1="527" y1="203" x2="606" y2="203" marker-end="url(#daA)"/>
    <line x1="606" y1="230" x2="529" y2="230" marker-end="url(#daA)"/>
    <line x1="315" y1="388" x2="315" y2="336" marker-end="url(#daA)"/>
    <line x1="470" y1="334" x2="500" y2="386" marker-end="url(#daA)"/>
    <line x1="700" y1="388" x2="552" y2="330" stroke-dasharray="5,4" marker-end="url(#daA)"/>
  </g>
  <text x="430" y="482" text-anchor="middle" font-size="11.5" fill="#6b7086">Arrows: request/response, secret injection, logs out, image pulled at deploy (dashed).</text>
</svg>
