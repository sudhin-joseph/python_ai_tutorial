<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#f8f9fc"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Production AI Engineering Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="12.5" fill="#6b7086">AIE Ch. 10 · GAIA Ch. 12 (Bedrock as the managed-service layer)</text>

  <g font-size="11.5" fill="#20222b">
    <rect x="20" y="200" width="100" height="50" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="70" y="229" text-anchor="middle">Client / App</text>

    <rect x="150" y="200" width="100" height="50" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="200" y="222" text-anchor="middle">API Gateway</text>
    <text x="200" y="238" text-anchor="middle" font-size="10">/ Router</text>

    <rect x="280" y="150" width="100" height="40" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="330" y="175" text-anchor="middle">Guardrails (in)</text>

    <rect x="280" y="260" width="100" height="40" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="330" y="285" text-anchor="middle">Guardrails (out)</text>

    <rect x="410" y="200" width="110" height="50" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="465" y="222" text-anchor="middle">Orchestrator</text>
    <text x="465" y="238" text-anchor="middle" font-size="10">(router / cache)</text>

    <rect x="560" y="120" width="130" height="44" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="625" y="146" text-anchor="middle">LLM / Model</text>
    <text x="625" y="160" text-anchor="middle" font-size="10">(Bedrock / SageMaker)</text>

    <rect x="560" y="200" width="130" height="44" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="625" y="226" text-anchor="middle">Vector DB</text>

    <rect x="560" y="280" width="130" height="44" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="625" y="306" text-anchor="middle">Tools / Agents</text>

    <rect x="740" y="200" width="140" height="50" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="810" y="222" text-anchor="middle">Feedback Store</text>
    <text x="810" y="238" text-anchor="middle" font-size="10">user signals, logs</text>

    <rect x="740" y="330" width="140" height="50" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="810" y="352" text-anchor="middle">Monitoring &amp;</text>
    <text x="810" y="368" text-anchor="middle">Evaluation</text>

    <rect x="410" y="330" width="260" height="50" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="540" y="352" text-anchor="middle">Fine-tuning &amp; Prompt Updates</text>
    <text x="540" y="368" text-anchor="middle" font-size="10">closes the loop (Tiers 7 &amp; 9)</text>
  </g>

  <g fill="none" stroke="#4f5ecb" stroke-width="1.8" marker-end="url(#a11)">
    <path d="M120,220 C130,220 140,222 148,224"/>
    <path d="M250,218 C260,200 265,185 278,170"/>
    <path d="M380,170 C395,185 400,195 408,210"/>
    <path d="M520,208 C535,185 545,170 558,150"/>
    <path d="M520,222 L558,222"/>
    <path d="M520,238 C535,260 545,275 558,296"/>
    <path d="M690,150 C710,170 720,185 735,205"/>
    <path d="M520,232 C500,250 400,260 380,264"/>
    <path d="M250,260 C260,275 265,282 278,282"/>
    <path d="M380,280 C395,260 400,245 408,236"/>
  </g>
  <g fill="none" stroke="#2f9e63" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#a11)">
    <path d="M810,250 L810,328"/>
    <path d="M740,355 L672,355"/>
  </g>
  <text x="450" y="420" text-anchor="middle" font-size="11.5" fill="#6b7086">Solid arrows: a request's path in. Dashed green: the feedback loop that turns production signal into the next</text>
  <text x="450" y="438" text-anchor="middle" font-size="11.5" fill="#6b7086">round of evaluation, fine-tuning, and prompt iteration.</text>
</svg>
