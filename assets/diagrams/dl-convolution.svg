<text x="300" y="208" text-anchor="middle" font-size="22" fill="#4f5ecb">*</text>
<text x="510" y="208" text-anchor="middle" font-size="22" fill="#4f5ecb">=</text>
<text x="400" y="332" text-anchor="middle" font-size="12" fill="#20222b">Top-left: each row gives 9x1 + 9x0 + 9x(-1) = 0, so 0.   One step right: 3 rows x (9 - 0) = 27.</text>
<text x="400" y="376" text-anchor="middle" font-size="11.5" fill="#6b7086">Output size = (n + 2p - k)/s + 1 = (5 - 3)/1 + 1 = 3. The same 9 weights are reused everywhere.</text>
