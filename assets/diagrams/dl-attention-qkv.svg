<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97a34"/></marker></defs>
  <rect width="800" height="440" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Scaled Dot-Product Attention</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">softmax(Q K.T / sqrt(d_k)) V, computed for all n tokens in parallel</text>
  <g font-size="12.5" fill="#20222b" text-anchor="middle">
    <rect x="260" y="88" width="280" height="40" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="400" y="113">Token embeddings X   (n, d_model)</text>
    <rect x="120" y="170" width="180" height="40" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="210" y="195">Q = X @ W_Q  (queries)</text>
    <rect x="320" y="170" width="180" height="40" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
    <text x="410" y="195">K = X @ W_K  (keys)</text>
    <rect x="550" y="170" width="180" height="40" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="640" y="195">V = X @ W_V  (values)</text>
    <rect x="120" y="250" width="380" height="40" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="310" y="275">Scores = Q @ K.T / sqrt(d_k)    shape (n, n)</text>
    <rect x="120" y="330" width="380" height="40" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
    <text x="310" y="355">Causal mask, then softmax over each row</text>
    <rect x="550" y="330" width="200" height="40" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
    <text x="650" y="355">Output = weights @ V</text>
  </g>
  <g fill="none" stroke="#4f5ecb" stroke-width="2" marker-end="url(#ah)">
    <path d="M360,128 L222,167"/>
    <path d="M405,128 L410,167"/>
    <path d="M450,128 L628,167"/>
    <path d="M210,210 L210,247"/>
    <path d="M410,210 L410,247"/>
    <path d="M310,290 L310,327"/>
    <path d="M500,350 L546,350"/>
    <path d="M640,210 L640,327"/>
  </g>
  <text x="400" y="414" text-anchor="middle" font-size="11.5" fill="#6b7086">Each output row is a weighted average of the value vectors; the weights come from query-key matches.</text>
</svg>
