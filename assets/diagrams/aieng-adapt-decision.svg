<svg viewBox="0 0 900 590" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/></marker></defs>
<rect width="900" height="590" fill="#f8f9fc"/>
<text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Prompt, RAG or Fine-Tune? A Decision Path</text>
<text x="450" y="52" text-anchor="middle" font-size="12" fill="#6b7086">AIE Ch. 7 · GAIA Ch. 5–6</text>
<rect x="50" y="80" width="360" height="50" rx="8" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
<text x="230.0" y="110.0" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Start: prompt engineering + an eval set</text>
<rect x="50" y="160" width="360" height="50" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
<text x="230.0" y="190.0" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Quality good enough on your evals?</text>
<rect x="500" y="160" width="350" height="50" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
<text x="675.0" y="190.0" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Ship it; keep monitoring</text>
<line x1="412" y1="185.0" x2="498" y2="185.0" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="455.0" y="177.0" text-anchor="middle" font-size="12" fill="#2f9e63" font-weight="700">yes</text>
<rect x="50" y="240" width="360" height="50" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
<text x="230.0" y="270.0" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Failures from missing or stale facts?</text>
<rect x="500" y="240" width="350" height="50" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
<text x="675.0" y="270.0" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Add RAG (and tools)</text>
<line x1="412" y1="265.0" x2="498" y2="265.0" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="455.0" y="257.0" text-anchor="middle" font-size="12" fill="#2f9e63" font-weight="700">yes</text>
<rect x="50" y="320" width="360" height="50" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
<text x="230.0" y="350.0" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Failures in format, style or behaviour?</text>
<rect x="500" y="320" width="350" height="50" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
<text x="675.0" y="350.0" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Fine-tune, start with LoRA</text>
<line x1="412" y1="345.0" x2="498" y2="345.0" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="455.0" y="337.0" text-anchor="middle" font-size="12" fill="#2f9e63" font-weight="700">yes</text>
<rect x="50" y="400" width="360" height="50" rx="8" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
<text x="230.0" y="430.0" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Need lower cost or latency at scale?</text>
<rect x="500" y="400" width="350" height="50" rx="8" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
<text x="675.0" y="430.0" text-anchor="middle" font-size="13" font-weight="700" fill="#20222b">Fine-tune / distil a smaller model</text>
<line x1="412" y1="425.0" x2="498" y2="425.0" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="455.0" y="417.0" text-anchor="middle" font-size="12" fill="#2f9e63" font-weight="700">yes</text>
<rect x="50" y="480" width="360" height="50" rx="8" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
<text x="230.0" y="510.0" text-anchor="middle" font-size="13" font-weight="400" fill="#20222b">Try a stronger model, decomposition, examples</text>
<line x1="230.0" y1="131" x2="230.0" y2="158" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="230.0" y1="211" x2="230.0" y2="238" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="240.0" y="230" font-size="12" fill="#d97a34" font-weight="700">no</text>
<line x1="230.0" y1="291" x2="230.0" y2="318" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="240.0" y="310" font-size="12" fill="#d97a34" font-weight="700">no</text>
<line x1="230.0" y1="371" x2="230.0" y2="398" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="240.0" y="390" font-size="12" fill="#d97a34" font-weight="700">no</text>
<line x1="230.0" y1="451" x2="230.0" y2="478" stroke="#4f5ecb" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="240.0" y="470" font-size="12" fill="#d97a34" font-weight="700">no</text>
<text x="450" y="568" text-anchor="middle" font-size="12" fill="#6b7086">RAG adds knowledge; fine-tuning changes behaviour. Many production systems combine both, and re-evaluate after each step.</text>
</svg>