<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="pyv-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5ecb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="430" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#20222b">Virtual Environments and pip</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" fill="#6b7086">pip downloads packages from PyPI into whichever project environment is active</text>

  <!-- PyPI -->
  <rect x="30" y="150" width="170" height="90" rx="10" fill="#ffffff" stroke="#c7cbe0" stroke-width="1.5"/>
  <text x="115" y="183" text-anchor="middle" font-size="15" font-weight="700" fill="#20222b">PyPI</text>
  <text x="115" y="204" text-anchor="middle" font-size="12" fill="#6b7086">pypi.org</text>
  <text x="115" y="222" text-anchor="middle" font-size="12" fill="#6b7086">public package index</text>

  <line x1="200" y1="195" x2="252" y2="195" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyv-arrow)"/>

  <!-- pip -->
  <rect x="256" y="160" width="130" height="70" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="321" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#20222b">pip install</text>
  <text x="321" y="210" text-anchor="middle" font-size="12" fill="#6b7086">into active venv</text>

  <line x1="386" y1="185" x2="456" y2="150" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyv-arrow)"/>
  <line x1="386" y1="205" x2="456" y2="275" stroke="#4f5ecb" stroke-width="2" marker-end="url(#pyv-arrow)"/>

  <!-- Project A -->
  <rect x="460" y="85" width="310" height="115" rx="10" fill="#eef7f0" stroke="#2f9e63" stroke-width="1.5"/>
  <text x="480" y="112" font-size="14" font-weight="700" fill="#20222b">project-a/.venv</text>
  <text x="480" y="136" font-size="12.5" fill="#20222b">python (link to base interpreter)</text>
  <text x="480" y="158" font-size="12.5" fill="#20222b">pandas 1.5.3</text>
  <text x="480" y="180" font-size="12.5" fill="#20222b">scikit-learn 1.3.2</text>

  <!-- Project B -->
  <rect x="460" y="220" width="310" height="115" rx="10" fill="#eef0fd" stroke="#4f5ecb" stroke-width="1.5"/>
  <text x="480" y="247" font-size="14" font-weight="700" fill="#20222b">project-b/.venv</text>
  <text x="480" y="271" font-size="12.5" fill="#20222b">python (link to base interpreter)</text>
  <text x="480" y="293" font-size="12.5" fill="#20222b">pandas 2.2.3</text>
  <text x="480" y="315" font-size="12.5" fill="#20222b">torch 2.4.1</text>

  <!-- System python -->
  <rect x="30" y="360" width="740" height="46" rx="10" fill="#fff4ea" stroke="#d97a34" stroke-width="1.5"/>
  <text x="400" y="388" text-anchor="middle" font-size="13" fill="#20222b">System / base Python: provides the interpreter, but you never pip install into it directly</text>
</svg>
