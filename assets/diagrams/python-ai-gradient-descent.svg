<text x="667" y="124" text-anchor="middle" font-size="12" fill="#20222b" font-weight="700">How it behaves</text>
<text x="667" y="143" text-anchor="middle" font-size="11" fill="#20222b" font-weight="400">big slope: big step</text>
<text x="667" y="162" text-anchor="middle" font-size="11" fill="#20222b" font-weight="400">small slope: small step</text>
<text x="667" y="181" text-anchor="middle" font-size="11" fill="#20222b" font-weight="400">steps shrink near</text>
<text x="667" y="200" text-anchor="middle" font-size="11" fill="#20222b" font-weight="400">the bottom</text>
<text x="667" y="219" text-anchor="middle" font-size="11" fill="#20222b" font-weight="400">η = learning rate</text>
<text x="380" y="356" text-anchor="middle" font-size="12" fill="#6b7086" font-weight="400">Too large a learning rate overshoots the valley; too small takes many tiny steps.</text>
